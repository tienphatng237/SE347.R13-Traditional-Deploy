server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    root /var/www/roadmap-maker;
    index index.html;
    # React/Vite client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
    # A trailing slash strips /api before Express receives the request.
    # /api/boards becomes /boards, matching the current backend routes.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api-docs/ {
        proxy_pass http://127.0.0.1:3000/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
